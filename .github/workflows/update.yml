name: 更新活動資料

on:
  schedule:
    # 每天台灣時間 06:00（UTC 22:00）—— public repo 的 Actions 免費無上限，
    # 每次只打幾個請求，沒有理由讓臨時加開的課等一週才出現。
    - cron: "0 22 * * *"
  workflow_dispatch: {} # 也可以在 Actions 頁面手動按一下就更新

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 解析規則自我測試
        run: python scripts/selftest.py

      # continue-on-error 是必要的，不是偷懶：抓不到任何活動時 build.py 會回傳 1，
      # 但它同時已經把「顯示的是舊資料」這條告警寫進 data/events.json。
      # 若這一步直接中斷 job，後面的提交步驟就不會跑，那條告警永遠上不了站 ——
      # 「資料默默停止更新、畫面上看不出來」正是這個站最想避免的事，卻會因此真的發生。
      # 所以：這步失敗照樣往下走，最後再用 fetch 的 outcome 把整個 run 標成紅色。
      - name: 抓取學會活動
        id: fetch
        continue-on-error: true
        run: python scripts/build.py

      - name: 個資掃描（抓回來的資料也要過）
        run: bash scripts/pii-scan.sh

      - name: 有變動才提交
        run: |
          # 🔴 變動判斷要看整個 data/，不能只看 events.json：
          # 訂閱檔可能單獨變動（例如只有 DTSTAMP 以外的欄位改了），
          # 只看 events.json 會讓那次更新整個跳過提交。
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "資料無變動，跳過提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 🔴 .ics 一定要跟著提交：訂閱端讀的是 repo 裡那份靜態檔，
          # 漏掉它的話網站每天更新、訂閱者的日曆卻永遠停在上一次手動提交的版本，
          # 而且不會有任何錯誤訊息（訂閱的人只會覺得「新課程都沒出現」）。
          # 用 `-A data/` 而不是逐一列檔名：地區訂閱檔（data/cme-north.ics …）
          # 會隨資料增減而新增／刪除，寫死檔名的話新地區永遠不會被提交，
          # 而消失的地區會留下一份不再更新的舊檔繼續騙訂閱者。
          git add -A data/
          # 日期用台灣時間：排程是 UTC 22:00（台灣隔天 06:00），
          # 用 UTC 日期會讓 commit 訊息永遠比台灣實際日期少一天
          git commit -m "chore: 自動更新活動資料 $(TZ=Asia/Taipei date +'%Y-%m-%d')"
          git push

      # 告警已經提交上去了，但這次執行仍然要是紅的 —— 否則沒人會發現來源掛了
      - name: 抓取失敗就讓這次執行變紅
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "本次沒有抓到任何活動；已保留既有資料並把告警寫進 data/events.json"
          exit 1
